

\n

\n<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영상 속 상품찾기 | 잇즈템</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#eaf5ef;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:#222;
}
.wrap{
  width:min(100%,860px);
  margin:auto;
  padding:22px 16px 56px;
}
.hero{text-align:center}
.logo{
  width:92px;height:92px;border-radius:50%;
  margin:0 auto 18px;
  background:#97ff18;border:7px solid #fff;
  display:grid;place-items:center;
  font-weight:900;font-size:20px;
}
h1{
  margin:0 0 18px;
  font-size:clamp(28px,5vw,42px);
  line-height:1.2;
}
.hero p{
  margin:0;
  font-size:clamp(15px,3.6vw,19px);
  line-height:1.55;
}
.search{
  display:flex;
  gap:8px;
  align-items:center;
  background:#fff;
  border-radius:18px;
  padding:10px 12px;
  margin:24px 0 20px;
}
.search input{
  min-width:0;
  flex:1;
  border:0;outline:0;
  font-size:clamp(16px,4vw,19px);
  padding:8px 4px;
}
.search button{
  flex:0 0 auto;
  border:1px solid #aaa;
  background:#fff;
  border-radius:10px;
  padding:9px 12px;
  font-size:15px;
  cursor:pointer;
}
.count{
  color:#666;
  font-size:16px;
  margin-bottom:10px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin:14px 0;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
  display:grid;
  grid-template-columns:112px minmax(0,1fr);
  gap:15px;
  align-items:center;
}
.thumb,.ph{
  width:112px;height:112px;border-radius:14px;
}
.thumb{object-fit:cover}
.ph{background:#f3f3f3;display:grid;place-items:center}
.badge{
  display:inline-block;
  background:#111;color:#fff;
  border-radius:999px;
  padding:5px 9px;
  font-weight:800;
  font-size:15px;
}
.name{
  font-size:20px;
  line-height:1.35;
  font-weight:800;
  margin:7px 0 10px;
  overflow-wrap:anywhere;
}
.buyrow{display:flex;gap:8px;flex-wrap:wrap}
.buy{
  display:inline-block;
  background:#111;color:#fff;
  text-decoration:none;
  padding:11px 15px;
  border-radius:12px;
  font-weight:800;
  font-size:16px;
}

@media (max-width:600px){
  .wrap{padding:16px 12px 40px}
  .logo{
    width:78px;height:78px;
    border-width:6px;
    font-size:18px;
    margin-bottom:14px;
  }
  h1{
    font-size:28px;
    margin-bottom:12px;
  }
  .hero p{
    font-size:16px;
    line-height:1.5;
  }
  .search{
    margin:20px 0 16px;
    padding:8px 10px;
    border-radius:16px;
  }
  .search input{
    font-size:16px;
    padding:7px 2px;
  }
  .search button{
    padding:8px 9px;
    font-size:14px;
    border-radius:9px;
  }
  .count{
    font-size:15px;
    margin-bottom:8px;
  }
  .card{
    grid-template-columns:88px minmax(0,1fr);
    gap:12px;
    padding:12px;
    border-radius:16px;
    margin:12px 0;
  }
  .thumb,.ph{
    width:88px;height:88px;
    border-radius:12px;
  }
  .badge{
    font-size:12px;
    padding:4px 8px;
  }
  .name{
    font-size:15px;
    line-height:1.35;
    margin:6px 0 9px;
  }
  .buy{
    padding:8px 11px;
    font-size:14px;
    border-radius:10px;
  }
}

@media (max-width:390px){
  h1{font-size:25px}
  .hero p{font-size:15px}
  .search{gap:6px}
  .search button{padding:8px 7px;font-size:13px}
  .card{
    grid-template-columns:78px minmax(0,1fr);
    gap:10px;
  }
  .thumb,.ph{width:78px;height:78px}
  .name{font-size:14px}
  .badge{font-size:11px}
}
</style>
</head><body><div class="wrap"><div class="hero"><div class="logo">잇즈템</div><h1>영상 속 상품찾기</h1>

<!-- ITSTEM_COUPANG_PARTNERS_DISCLOSURE -->
<style>
.itstem-coupang-disclosure {
    box-sizing: border-box;
    width: min(760px, calc(100% - 32px));
    margin: 12px auto 18px;
    padding: 10px 14px;
    border: 1px solid rgba(0,0,0,.14);
    border-radius: 10px;
    background: rgba(255,255,255,.78);
    color: #333;
    font-size: 13px;
    line-height: 1.5;
    font-weight: 600;
    text-align: center;
}
@media (max-width:600px) {
    .itstem-coupang-disclosure {
        width: calc(100% - 24px);
        margin: 10px auto 14px;
        padding: 9px 10px;
        font-size: 12px;
    }
}
</style>
<div class="itstem-coupang-disclosure" role="note" aria-label="쿠팡 파트너스 고지">
  이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
</div>

<p>영상에 표시된 <b>상품번호</b>를 입력해 주세요.<br>상품명으로도 검색할 수 있어요.</p></div><div class="search"><input id="q" placeholder="예: 2번 또는 낚시 감기기"><button onclick="render()">검색</button><button onclick="q.value='';render()">지우기</button></div><div id="count" class="count"></div><div id="list"></div></div><script src="products.js"></script><script>
const DATA=Array.isArray(window.PRODUCTS)?window.PRODUCTS:[];const q=document.getElementById('q'),list=document.getElementById('list'),count=document.getElementById('count');function n(s){return String(s||'').toLowerCase().trim()}function render(){
 const t=n(q.value);
 let rows=[];
 if(!t){
   rows=DATA;
 }else{
   const numberOnly=t.replace(/번/g,'').replace(/\s/g,'');
   if(/^\d+$/.test(numberOnly)){
     const wanted=String(parseInt(numberOnly,10));
     rows=DATA.filter(x=>String(x.internal_no)===wanted);
   }else{
     rows=DATA.filter(x=>[x.name,x.keywords,x.smartstore_product_no].map(n).some(v=>v.includes(t)));
   }
 }
 count.textContent='검색 결과 '+rows.length+'개';
 list.innerHTML=rows.map(x=>`<div class="card">${x.image?`<img class="thumb" src="${x.image}">`:'<div class="ph">🛍️</div>'}<div><span class="badge">상품번호 ${x.internal_no}번</span><div class="name">${x.name}</div><div class="buyrow">${x.url?`<a class="buy" href="${x.url}" target="_blank" rel="noopener">스마트스토어 구매</a>`:''}${x.coupang_url?`<a class="buy" href="${x.coupang_url}" target="_blank" rel="noopener">쿠팡 구매</a>`:''}</div></div></div>`).join('')||'<p>검색 결과가 없습니다.</p>'
}
q.addEventListener('input',render);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();render();}});
render();
</script>


</body></html>
